<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --paper: #f6efe4;
    --paper-2: #efe4d3;
    --wood-dark: #3b2618;
    --wood: #6b4226;
    --wood-mid: #8a5a36;
    --honey: #c98b45;
    --honey-light: #e9c48f;
    --ink: #2a1c12;
    --muted: #7a6656;
    --line: rgba(59, 38, 24, 0.14);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html[lang="ar"] { --serif: "Cairo", system-ui, sans-serif; --sans: "Cairo", system-ui, sans-serif; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2a1c12; }

  body {
    font-family: var(--sans);
    color: var(--ink);
    min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center; align-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    /* dark wood planks background */
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 120px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 19px),
      linear-gradient(180deg, #4a3020, #2a1c12);
  }

  .card {
    width: 100%; max-width: 430px;
    background: var(--paper);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.08) inset;
    animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- Header: wood panel ---------- */
  .hero {
    position: relative;
    padding: 18px 22px 64px;
    color: #fbf3e6;
    background:
      radial-gradient(120% 80% at 20% 0%, rgba(233,196,143,.25), transparent 60%),
      repeating-radial-gradient(ellipse at 30% 140%, rgba(0,0,0,.10) 0 2px, transparent 2px 11px),
      repeating-linear-gradient(100deg, rgba(255,255,255,.04) 0 1px, transparent 1px 6px),
      linear-gradient(160deg, #8a5a36, #5a3620 55%, #3b2618);
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand {
    font-family: var(--serif); font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--honey-light); opacity: .9;
  }
  html[lang="ar"] .brand { letter-spacing: 0; font-size: 13px; }
  .langs {
    display: flex; gap: 2px; padding: 3px;
    background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; direction: ltr;
  }
  .langs button {
    font: 700 11.5px var(--sans); color: rgba(251,243,230,.7);
    background: transparent; border: 0; padding: 5px 9px; border-radius: 7px; cursor: pointer;
  }
  html[lang="ar"] .langs button { font-family: "Inter", sans-serif; }
  .langs button[aria-pressed="true"] { background: var(--honey-light); color: var(--wood-dark); }

  .who { display: flex; align-items: center; gap: 16px; margin-top: 26px; }
  .logo {
    flex: none; width: 74px; height: 74px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--paper);
    color: var(--wood);
    border: 3px solid var(--honey-light);
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
  }
  .logo svg { width: 40px; height: 40px; }
  .name { font-family: var(--serif); font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; }
  .role { margin-top: 5px; font-size: 14.5px; color: var(--honey-light); font-weight: 600; }

  /* ruler strip at bottom of hero */
  .ruler {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    background:
      repeating-linear-gradient(90deg, var(--wood-dark) 0 1px, transparent 1px 8px) bottom / 100% 7px no-repeat,
      repeating-linear-gradient(90deg, var(--wood-dark) 0 1.5px, transparent 1.5px 40px) bottom / 100% 13px no-repeat,
      linear-gradient(#e9c48f, #d9ab6c);
    border-top: 1px solid rgba(0,0,0,.25);
    direction: ltr;
  }

  /* ---------- Body ---------- */
  .body { padding: 22px 22px 20px; }

  .tagline {
    font-family: var(--serif); font-size: 18px; line-height: 1.4; font-weight: 500;
    color: var(--wood-dark); margin-bottom: 18px;
  }
  html[lang="ar"] .tagline { font-weight: 600; font-size: 17px; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; color: var(--wood);
    background: var(--paper-2); border: 1px solid var(--line);
  }
  .badge svg { width: 14px; height: 14px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    padding: 14px 12px; border-radius: 14px;
    font-family: inherit; font-size: 15px; font-weight: 700;
    text-decoration: none; border: 1px solid transparent; cursor: pointer;
    transition: transform .15s, box-shadow .2s, background .2s;
  }
  .btn:active { transform: scale(.98); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn.call { background: var(--wood-dark); color: #fbf3e6; }
  .btn.call:hover { box-shadow: 0 8px 22px rgba(59,38,24,.35); }
  .btn.wa { background: #25d366; color: #06301a; }
  .btn.wa:hover { box-shadow: 0 8px 22px rgba(37,211,102,.35); }
  .btn.quote {
    grid-column: 1 / -1;
    background: linear-gradient(120deg, var(--honey), #b5742f);
    color: #fffaf2;
  }
  .btn.quote:hover { box-shadow: 0 10px 26px rgba(201,139,69,.4); }

  h2 {
    font-family: var(--serif); font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .16em; color: var(--muted);
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 12px;
  }
  html[lang="ar"] h2 { letter-spacing: 0; font-size: 14px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .services { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 22px; }
  .svc {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: 12px;
    background: #fffaf2; border: 1px solid var(--line);
    font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.25;
  }
  .svc svg { width: 20px; height: 20px; flex: none; color: var(--honey); }

  .list { background: #fffaf2; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 18px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; color: inherit; text-decoration: none; }
  .row + .row { border-top: 1px solid var(--line); }
  a.row:hover { background: rgba(201,139,69,.07); }
  .ico {
    width: 36px; height: 36px; flex: none; border-radius: 10px;
    display: grid; place-items: center;
    background: rgba(201,139,69,.14); color: var(--wood);
  }
  .ico svg { width: 18px; height: 18px; }
  .meta { flex: 1; min-width: 0; }
  .label { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  html[lang="ar"] .label { text-transform: none; letter-spacing: 0; font-size: 12.5px; }
  .value { font-size: clamp(12.5px, 3.5vw, 14.5px); font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
  html[dir="rtl"] .value[dir="ltr"] { text-align: right; }
  .chev { color: var(--muted); flex: none; }
  .chev svg { width: 16px; height: 16px; }
  html[dir="rtl"] .chev svg { transform: scaleX(-1); }

  .save {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    padding: 14px; border-radius: 14px;
    background: transparent; color: var(--wood-dark);
    border: 1.5px dashed rgba(59,38,24,.45);
    font: 700 15px var(--sans); cursor: pointer;
    transition: background .2s;
  }
  .save:hover { background: rgba(59,38,24,.05); }
  .save svg { width: 18px; height: 18px; }

  .foot {
    margin-top: 16px; text-align: center;
    font-size: 12px; color: var(--muted);
  }
  .foot button {
    background: none; border: 0; color: var(--wood); font: 600 12.5px var(--sans);
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--wood-dark); color: #fbf3e6; padding: 10px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 600; box-shadow: 0 12px 30px rgba(0,0,0,.35);
    transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; }

  @media (max-width: 370px) {
    .services { grid-template-columns: 1fr; }
    .name { font-size: 24px; }
    .body { padding: 20px 16px 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<body>

    <h2 data-i18n="contactTitle">Contact</h2>

</main>

<script>

const SERVICES = [
  { icon: "sofa",     fr: "Meubles sur mesure",     en: "Custom furniture",      ar: "أثاث حسب الطلب" },
  { icon: "kitchen",  fr: "Cuisines",               en: "Kitchens",              ar: "مطابخ" },
  { icon: "door",     fr: "Portes et fenêtres",     en: "Doors & windows",       ar: "أبواب ونوافذ" },
  { icon: "wardrobe", fr: "Placards et dressings",  en: "Wardrobes & closets",   ar: "خزائن ودواليب" },
  { icon: "ceiling",  fr: "Plafonds et habillage",  en: "Ceilings & paneling",   ar: "أسقف وتكسية خشبية" },
  { icon: "tools",    fr: "Réparation et rénovation", en: "Repair & restoration", ar: "إصلاح وترميم" }
];

const I18N = {
  fr: {
    brand: "Menuiserie Mali",
    name: "Mohammed Mali",
    role: "Menuisier · Ébéniste",
    tagline: "Travail du bois sur mesure, fabriqué avec soin et livré dans les délais.",
    call: "Appeler", whatsapp: "WhatsApp",
    quote: "Demander un devis gratuit",
    servicesTitle: "Services", contactTitle: "Contact",
    phone: "Téléphone", email: "E-mail", workshop: "Atelier", hours: "Horaires",
    save: "Enregistrer le contact", share: "Partager cette carte",
    years: n => `${n} ans d'expérience`,
    madeToMeasure: "Sur mesure", freeQuote: "Devis gratuit",
    waMsg: "Bonjour Mohammed, je voudrais un devis pour : ",
    saved: "Fiche contact téléchargée", linkCopied: "Lien copié !"
  },
  en: {

    tagline: "Custom woodwork, built with care and delivered on time.",

    quote: "Get a free quote",

    phone: "Phone", email: "Email", workshop: "Workshop", hours: "Hours",
    save: "Save contact", share: "Share this card",
    years: n => `${n} years of experience`,
    madeToMeasure: "Made to measure", freeQuote: "Free quote",

    quote: "اطلب عرض سعر مجاني",
    servicesTitle: "الخدمات", contactTitle: "التواصل",
    phone: "الهاتف", email: "البريد الإلكتروني", workshop: "الورشة", hours: "أوقات العمل",
    save: "حفظ جهة الاتصال", share: "مشاركة البطاقة",
    years: n => `${n} سنة من الخبرة`,
    madeToMeasure: "حسب المقاس", freeQuote: "عرض سعر مجاني",
    waMsg: "السلام عليكم سي محمد، أريد عرض سعر لـ: ",
    saved: "تم تنزيل ملف جهة الاتصال", linkCopied: "تم نسخ الرابط!"
  }
};

/* ---------- Icons ---------- */
const S = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  sofa:     `<svg ${S}><path d="M4 11V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/><path d="M5 18v2M19 18v2"/></svg>`,
  kitchen:  `<svg ${S}><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 10h18M12 10v11M8 6.5h.01M16 6.5h.01M9 14v2M15 14v2"/></svg>`,

/* ---------- Render ---------- */
let current = "fr";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function row({ icon, label, value, href, ltr, external }) {
  const tag = href ? "a" : "div";
  const attrs = href ? ` href="${esc(href)}"${external ? ' target="_blank" rel="noopener"' : ""}` : "";
  return `<${tag} class="row"${attrs}>
    <span class="ico">${ICONS[icon]}</span>
    <span class="meta"><span class="label" style="display:block">${esc(label)}</span>
      <span class="value" style="display:block"${ltr ? ' dir="ltr"' : ""}>${esc(value)}</span></span>
    ${href ? `<span class="chev">${ICONS.chev}</span>` : ""}
  </${tag}>`;
}

function render() {
  const t = I18N[current];

  // Badges
  const badges = [];
  if (CONFIG.yearsExperience) badges.push(["award", t.years(CONFIG.yearsExperience)]);
  badges.push(["ruler", t.madeToMeasure]);
  badges.push(["check", t.freeQuote]);
  if (CONFIG.city) badges.push(["pin", CONFIG.city]);
  $("badges").innerHTML = badges.map(([i, txt]) => `<span class="badge">${ICONS[i]}${esc(txt)}</span>`).join("");

  // Services
  $("services").innerHTML = SERVICES.map(s => `<div class="svc">${ICONS[s.icon]}<span>${esc(s[current])}</span></div>`).join("");

  // Contact rows
  const rows = [
    row({ icon: "phone", label: t.phone, value: CONFIG.phoneDisplay, href: "tel:" + CONFIG.phone, ltr: true }),
    row({ icon: "mail", label: t.email, value: CONFIG.email, href: "mailto:" + CONFIG.email, ltr: true })
  ];
  if (CONFIG.address || CONFIG.mapsLink) rows.push(row({ icon: "pin", label: t.workshop, value: CONFIG.address || CONFIG.city || "Google Maps", href: CONFIG.mapsLink, external: true }));
  if (CONFIG.hours) rows.push(row({ icon: "clock", label: t.hours, value: CONFIG.hours }));
  if (CONFIG.instagram) rows.push(row({ icon: "insta", label: "Instagram", value: CONFIG.instagram.replace(/^https?:\/\/(www\.)?/, ""), href: CONFIG.instagram, ltr: true, external: true }));
  if (CONFIG.facebook) rows.push(row({ icon: "fb", label: "Facebook", value: CONFIG.facebook.replace(/^https?:\/\/(www\.)?/, ""), href: CONFIG.facebook, ltr: true, external: true }));
  $("contactList").innerHTML = rows.join("");

  // Links
  $("callBtn").href = "tel:" + CONFIG.phone;
  $("waBtn").href = "https://wa.me/" + CONFIG.whatsapp;
  $("quoteBtn").href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(t.waMsg);
}

function setLang(lang) {
  if (!I18N[lang]) lang = "fr";
  current = lang;
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = `${t.name} · ${t.role}`;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t[el.dataset.i18n];
    if (typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));
  render();
  try { localStorage.setItem("mm-card-lang", lang); } catch (e) {}
}

(function init() {
  let lang = null;
  try { lang = localStorage.getItem("mm-card-lang"); } catch (e) {}
  const q = new URLSearchParams(location.search).get("lang");
  if (q) lang = q;
  if (!lang) {
    const nav = (navigator.language || "fr").slice(0, 2).toLowerCase();
    lang = I18N[nav] ? nav : "fr";
  }
  setLang(lang);
})();

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

/* ---------- Save contact (vCard) ---------- */
$("saveBtn").addEventListener("click", () => {
  const lines = [
    "BEGIN:VCARD", "VERSION:3.0",
    "N:Mali;Mohammed;;;",
    "FN:Mohammed Mali",
    "ORG:Menuiserie Mali",
    "TITLE:Menuisier / Carpenter / نجار",
    "TEL;TYPE=CELL:" + CONFIG.phone,
    "EMAIL;TYPE=INTERNET:" + CONFIG.email
  ];
  if (CONFIG.address) lines.push("ADR;TYPE=WORK:;;" + CONFIG.address + ";" + (CONFIG.city || "") + ";;;Morocco");
  if (CONFIG.instagram) lines.push("URL:" + CONFIG.instagram);
  lines.push("URL:" + location.href.split("?")[0]);
  lines.push("NOTE:Meubles sur mesure, cuisines, portes, placards");
  lines.push("END:VCARD");

  const blob = new Blob([lines.join("\r\n")], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "Mohammed-Mali.vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(I18N[current].saved);
});

/* ---------- Share ---------- */
$("shareBtn").addEventListener("click", async () => {
  const t = I18N[current];
  if (navigator.share) {
    try { await navigator.share({ title: t.name, text: t.role, url: location.href }); } catch (e) {}
  } else {
    try { await navigator.clipboard.writeText(location.href); toast(t.linkCopied); } catch (e) {}
  }
});
</script>
</body>
