<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Amine Anbar · AnbarElec</title>
<meta name="description" content="AnbarElec — Électricien · Réseaux, caméras, maison intelligente.">
<meta name="theme-color" content="#0b1a2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1a2e'/%3E%3Cpath d='M36 6 16 36h14l-4 22 22-32H34z' fill='%23ffc928'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07111f; --navy:#0b1a2e; --navy2:#12294a; --volt:#ffc928; --volt2:#ff9f1c;
  --cyan:#3ad6ff; --paper:#f3f6fa; --card:#ffffff; --ink:#0b1a2e; --muted:#5d6f86;
  --line:rgba(11,26,46,.12);
  --serif:"Space Grotesk",system-ui,sans-serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html[lang="ar"]{--serif:"Cairo",system-ui,sans-serif;--sans:"Cairo",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:var(--sans);color:var(--ink);min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:center;padding:24px 16px;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 15% 10%,rgba(58,214,255,.12),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(255,201,40,.10),transparent 40%),
    linear-gradient(rgba(58,214,255,.05) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,rgba(58,214,255,.05) 1px,transparent 1px) 0 0/32px 32px,
    var(--bg);
}
.card{width:100%;max-width:430px;background:var(--paper);border-radius:22px;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(58,214,255,.15);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.hero{position:relative;padding:18px 22px 68px;color:#eaf4ff;
  background:
    radial-gradient(120% 80% at 80% 0%,rgba(58,214,255,.22),transparent 60%),
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/22px 22px,
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/22px 22px,
    linear-gradient(160deg,#16396b,#0b1a2e 70%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--serif);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--volt)}
html[lang="ar"] .brand{letter-spacing:0;font-size:13px}
.langs{display:flex;gap:2px;padding:3px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:10px;direction:ltr}
.langs button{font:700 11.5px var(--sans);color:rgba(234,244,255,.7);background:transparent;border:0;padding:5px 9px;border-radius:7px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--volt);color:var(--navy)}
.who{display:flex;align-items:center;gap:16px;margin-top:26px}
.logo{flex:none;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:var(--navy);
  border:3px solid var(--volt);box-shadow:0 0 0 5px rgba(255,201,40,.18),0 0 26px rgba(255,201,40,.45);color:var(--volt)}
.logo svg{width:40px;height:40px}
.name{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.1}
.role{margin-top:5px;font-size:14.5px;color:var(--volt);font-weight:600}
/* cable strip */
.cable{position:absolute;left:0;right:0;bottom:0;height:26px;direction:ltr;
  background:repeating-linear-gradient(135deg,var(--volt) 0 14px,var(--navy) 14px 28px);
  border-top:2px solid var(--volt2)}

.body{padding:22px 22px 20px}
.tagline{font-family:var(--serif);font-size:18px;line-height:1.4;font-weight:500;color:var(--navy);margin-bottom:18px}
html[lang="ar"] .tagline{font-weight:600;font-size:17px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--navy2);background:#e5edf7;border:1px solid var(--line)}
.badge svg{width:14px;height:14px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 12px;border-radius:14px;font:700 15px var(--sans);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;flex:none}
.btn.call{background:var(--navy);color:#eaf4ff}
.btn.call:hover{box-shadow:0 8px 22px rgba(11,26,46,.4)}
.btn.wa{background:#25d366;color:#06301a}
.btn.wa:hover{box-shadow:0 8px 22px rgba(37,211,102,.35)}
.btn.quote{grid-column:1/-1;background:linear-gradient(120deg,var(--volt),var(--volt2));color:var(--navy)}
.btn.quote:hover{box-shadow:0 10px 26px rgba(255,159,28,.45)}

h2{font-family:var(--serif);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);display:flex;align-items:center;gap:10px;margin:0 0 12px}
html[lang="ar"] h2{letter-spacing:0;font-size:14px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

.services{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.svc{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;line-height:1.25;border-inline-start:3px solid var(--volt)}
.svc svg{width:22px;height:22px;flex:none;color:var(--volt2)}

.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;color:inherit;text-decoration:none}
.row+.row{border-top:1px solid var(--line)}
a.row:hover{background:rgba(255,201,40,.12)}
.ico{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--navy);color:var(--volt)}
.ico svg{width:18px;height:18px}
.meta{flex:1;min-width:0}
.label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
html[lang="ar"] .label{text-transform:none;letter-spacing:0;font-size:12.5px}
.value{display:block;font-size:clamp(12.5px,3.5vw,14.5px);font-weight:600;margin-top:2px;overflow-wrap:anywhere}
html[dir="rtl"] .value[dir="ltr"]{text-align:right}
.chev{color:var(--muted);flex:none}
.chev svg{width:16px;height:16px}
html[dir="rtl"] .chev svg{transform:scaleX(-1)}

.save{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px;border-radius:14px;background:transparent;color:var(--navy);border:1.5px dashed rgba(11,26,46,.45);font:700 15px var(--sans);cursor:pointer;transition:background .2s}
.save:hover{background:rgba(11,26,46,.05)}
.save svg{width:18px;height:18px}
.foot{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--navy2);font:600 12.5px var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--navy);color:var(--volt);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.4);transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--volt2);outline-offset:2px}
@media(max-width:370px){.services{grid-template-columns:1fr}.name{font-size:24px}.body{padding:20px 16px 18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <section class="hero">
    <div class="top">
      <span class="brand" data-i18n="brand">AnbarElec</span>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="ar">ع</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <div class="who">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="currentColor"><path d="M27 3 9 27h11l-3 18 21-27H26z"/></svg>
      </div>
      <div>
        <h1 class="name" data-i18n="name">Amine Anbar</h1>
        <p class="role" data-i18n="role">Électricien · Réseaux & Domotique</p>
      </div>
    </div>
    <div class="cable" aria-hidden="true"></div>
  </section>

  <section class="body">
    <p class="tagline" data-i18n="tagline">Installation électrique, réseaux, caméras et maison intelligente, en toute sécurité.</p>
    <div class="badges" id="badges"></div>
    <div class="actions">
      <a class="btn call" id="callBtn" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        <span data-i18n="call">Appeler</span>
      </a>
      <a class="btn wa" id="waBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>
        <span data-i18n="whatsapp">WhatsApp</span>
      </a>
      <a class="btn quote" id="quoteBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
        <span data-i18n="quote">Demander un devis gratuit</span>
      </a>
    </div>

    <h2 data-i18n="servicesTitle">Services</h2>
    <div class="services" id="services"></div>

    <h2 data-i18n="contactTitle">Contact</h2>
    <nav class="list" id="contactList"></nav>

    <button class="save" type="button" id="saveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      <span data-i18n="save">Enregistrer le contact</span>
    </button>
    <p class="foot"><button type="button" id="shareBtn" data-i18n="share">Partager cette carte</button></p>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== EDIT YOUR DETAILS HERE. Leave "" to hide a field. ===== */
const CONFIG = {
  phones: [
    { tel: "+212637214054", display: "06 37 21 40 54" },
    { tel: "+212650962846", display: "06 50 96 28 46" }
  ],
  whatsapp: "212637214054",
  email: "kokokabo2000@gmail.com",
  city: "", address: "", mapsLink: "", hours: "",
  yearsExperience: "", instagram: "", facebook: ""
};

const SERVICES = [
  { icon: "network", fr: "Installation réseau (Wi-Fi, LAN)", en: "Network installation (Wi-Fi, LAN)", ar: "تركيب الشبكات (واي فاي، LAN)" },
  { icon: "cam",     fr: "Caméras de surveillance",         en: "Home security cameras",            ar: "كاميرات المراقبة" },
  { icon: "smart",   fr: "Maison intelligente",             en: "Smart home",                       ar: "المنزل الذكي" },
  { icon: "bolt",    fr: "Installation électrique",         en: "Electrical installation",          ar: "تركيبات كهربائية" },
  { icon: "bulb",    fr: "Éclairage et tableaux",           en: "Lighting & panels",                ar: "إنارة ولوحات كهربائية" },
  { icon: "tools",   fr: "Dépannage et rénovation",         en: "Repair & renovation",              ar: "إصلاح وصيانة" }
];

const I18N = {
  fr: { brand:"AnbarElec", name:"Amine Anbar", role:"Électricien · Réseaux & Domotique",
    tagline:"Installation électrique, réseaux, caméras et maison intelligente, en toute sécurité.",
    call:"Appeler", whatsapp:"WhatsApp", quote:"Demander un devis gratuit",
    servicesTitle:"Services", contactTitle:"Contact",
    phone:"Téléphone", email:"E-mail", workshop:"Adresse", hours:"Horaires",
    save:"Enregistrer le contact", share:"Partager cette carte",
    years:n=>`${n} ans d'expérience`, safe:"Travail sécurisé", freeQuote:"Devis gratuit",
    waMsg:"Bonjour Amine, je voudrais un devis pour : ",
    saved:"Fiche contact téléchargée", linkCopied:"Lien copié !" },
  en: { brand:"AnbarElec", name:"Amine Anbar", role:"Electrician · Networks & Smart home",
    tagline:"Electrical work, networks, cameras and smart homes, done safely.",
    call:"Call", whatsapp:"WhatsApp", quote:"Get a free quote",
    servicesTitle:"Services", contactTitle:"Contact",
    phone:"Phone", email:"Email", workshop:"Address", hours:"Hours",
    save:"Save contact", share:"Share this card",
    years:n=>`${n} years of experience`, safe:"Safe work", freeQuote:"Free quote",
    waMsg:"Hello Amine, I'd like a quote for: ",
    saved:"Contact file downloaded", linkCopied:"Link copied!" },
  ar: { brand:"أنبار إلك", name:"أمين أنبار", role:"كهربائي · شبكات ومنزل ذكي",
    tagline:"تركيبات كهربائية، شبكات، كاميرات ومنازل ذكية، بأمان وإتقان.",
    call:"اتصال", whatsapp:"واتساب", quote:"اطلب عرض سعر مجاني",
    servicesTitle:"الخدمات", contactTitle:"التواصل",
    phone:"الهاتف", email:"البريد الإلكتروني", workshop:"العنوان", hours:"أوقات العمل",
    save:"حفظ جهة الاتصال", share:"مشاركة البطاقة",
    years:n=>`${n} سنة من الخبرة`, safe:"عمل آمن", freeQuote:"عرض سعر مجاني",
    waMsg:"السلام عليكم سي أمين، أريد عرض سعر لـ: ",
    saved:"تم تنزيل ملف جهة الاتصال", linkCopied:"تم نسخ الرابط!" }
};

const S='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  network:`<svg ${S}><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></svg>`,
  cam:`<svg ${S}><path d="M3 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m16 11 5-3v8l-5-3"/><path d="M7 21h5"/></svg>`,
  smart:`<svg ${S}><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M9.5 14.5a3.5 3.5 0 0 1 5 0M7.5 12.5a6.4 6.4 0 0 1 9 0M12 17.5h.01"/></svg>`,
  bolt:`<svg ${S}><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>`,
  bulb:`<svg ${S}><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>`,
  tools:`<svg ${S}><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-3-3 8-8"/><path d="m3 21 7-7M7 3l4 4-2 2-4-4z"/></svg>`,
  phone:`<svg ${S}><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>`,
  mail:`<svg ${S}><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>`,
  pin:`<svg ${S}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  clock:`<svg ${S}><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`,
  insta:`<svg ${S}><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>`,
  fb:`<svg ${S}><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>`,
  chev:`<svg ${S}><path d="m9 18 6-6-6-6"/></svg>`,
  check:`<svg ${S}><path d="M20 6 9 17l-5-5"/></svg>`,
  award:`<svg ${S}><circle cx="12" cy="8" r="6"/><path d="M15.5 13 17 22l-5-3-5 3 1.5-9"/></svg>`,
  shield:`<svg ${S}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>`
};

let current="fr";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function row({icon,label,value,href,ltr,external}){
  const tag=href?"a":"div";
  const attrs=href?` href="${esc(href)}"${external?' target="_blank" rel="noopener"':""}`:"";
  return `<${tag} class="row"${attrs}><span class="ico">${ICONS[icon]}</span>
    <span class="meta"><span class="label">${esc(label)}</span><span class="value"${ltr?' dir="ltr"':""}>${esc(value)}</span></span>
    ${href?`<span class="chev">${ICONS.chev}</span>`:""}</${tag}>`;
}

function render(){
  const t=I18N[current], P=CONFIG.phones;
  const badges=[];
  if(CONFIG.yearsExperience) badges.push(["award",t.years(CONFIG.yearsExperience)]);
  badges.push(["shield",t.safe],["check",t.freeQuote]);
  if(CONFIG.city) badges.push(["pin",CONFIG.city]);
  $("badges").innerHTML=badges.map(([i,x])=>`<span class="badge">${ICONS[i]}${esc(x)}</span>`).join("");
  $("services").innerHTML=SERVICES.map(s=>`<div class="svc">${ICONS[s.icon]}<span>${esc(s[current])}</span></div>`).join("");

  const rows=P.map(p=>row({icon:"phone",label:t.phone,value:p.display,href:"tel:"+p.tel,ltr:true}));
  rows.push(row({icon:"mail",label:t.email,value:CONFIG.email,href:"mailto:"+CONFIG.email,ltr:true}));
  if(CONFIG.address||CONFIG.mapsLink) rows.push(row({icon:"pin",label:t.workshop,value:CONFIG.address||CONFIG.city||"Google Maps",href:CONFIG.mapsLink,external:true}));
  if(CONFIG.hours) rows.push(row({icon:"clock",label:t.hours,value:CONFIG.hours}));
  if(CONFIG.instagram) rows.push(row({icon:"insta",label:"Instagram",value:CONFIG.instagram.replace(/^https?:\/\/(www\.)?/,""),href:CONFIG.instagram,ltr:true,external:true}));
  if(CONFIG.facebook) rows.push(row({icon:"fb",label:"Facebook",value:CONFIG.facebook.replace(/^https?:\/\/(www\.)?/,""),href:CONFIG.facebook,ltr:true,external:true}));
  $("contactList").innerHTML=rows.join("");

  $("callBtn").href="tel:"+P[0].tel;
  $("waBtn").href="https://wa.me/"+CONFIG.whatsapp;
  $("quoteBtn").href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(t.waMsg);
}

function setLang(lang){
  if(!I18N[lang]) lang="fr";
  current=lang;
  const t=I18N[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=`${t.name} · ${t.brand}`;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const v=t[el.dataset.i18n]; if(typeof v==="string") el.textContent=v;});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
  render();
  try{localStorage.setItem("anbar-card-lang",lang)}catch(e){}
}

(function(){
  let lang=null;
  try{lang=localStorage.getItem("anbar-card-lang")}catch(e){}
  const q=new URLSearchParams(location.search).get("lang");
  if(q) lang=q;
  if(!lang){const n=(navigator.language||"fr").slice(0,2).toLowerCase(); lang=I18N[n]?n:"fr";}
  setLang(lang);
})();
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

let tt;
function toast(m){const el=$("toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),1800)}

$("saveBtn").addEventListener("click",()=>{
  const L=["BEGIN:VCARD","VERSION:3.0","N:Anbar;Amine;;;","FN:Amine Anbar","ORG:AnbarElec",
    "TITLE:Électricien / Electrician / كهربائي"];
  CONFIG.phones.forEach(p=>L.push("TEL;TYPE=CELL:"+p.tel));
  L.push("EMAIL;TYPE=INTERNET:"+CONFIG.email);
  if(CONFIG.address) L.push("ADR;TYPE=WORK:;;"+CONFIG.address+";"+(CONFIG.city||"")+";;;Morocco");
  if(CONFIG.instagram) L.push("URL:"+CONFIG.instagram);
  L.push("URL:"+location.href.split("?")[0]);
  L.push("NOTE:Électricité, réseaux, caméras, maison intelligente","END:VCARD");
  const url=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/vcard;charset=utf-8"}));
  const a=document.createElement("a");
  a.href=url;a.download="Amine-Anbar.vcf";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(I18N[current].saved);
});

$("shareBtn").addEventListener("click",async()=>{
  const t=I18N[current];
  if(navigator.share){try{await navigator.share({title:t.name,text:t.role,url:location.href})}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(t.linkCopied)}catch(e){}}
});
</script>
