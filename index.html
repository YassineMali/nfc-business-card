<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Business Card</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
        }

        .name {
            font-size: 30px;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
        }

        .job {
            font-size: 17px;
            color: #666;
            margin-bottom: 30px;
        }

        .info {
            margin-bottom: 25px;
        }

        .info p {
            margin: 10px 0;
            color: #444;
            font-size: 15px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .whatsapp {
            background: #25D366;
            color: white;
        }

        .phone {
            background: #222;
            color: white;
        }

        .email {
            background: #eee;
            color: #222;
        }

        .social {
            background: #f5f5f5;
            color: #222;
        }

        .save {
            background: #111;
            color: white;
            margin-top: 5px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="name">Your Name</div>

    <div class="job">Full-Stack Developer</div>

    <div class="info">
        <p>📞 +212 6 XX XX XX XX</p>
        <p>✉️ your@email.com</p>
    </div>

    <div class="buttons">

        <!-- WhatsApp -->
        <a
            class="button whatsapp"
            href="https://wa.me/212600000000"
            target="_blank">
            💬 WhatsApp
        </a>

        <!-- Phone -->
        <a
            class="button phone"
            href="tel:+212600000000">
            📞 Call Me
        </a>

        <!-- Email -->
        <a
            class="button email"
            href="mailto:your@email.com">
            ✉️ Email
        </a>

        <!-- LinkedIn -->
        <a
            class="button social"
            href="https://www.linkedin.com/"
            target="_blank">
            💼 LinkedIn
        </a>

        <!-- GitHub -->
        <a
            class="button social"
            href="https://github.com/"
            target="_blank">
            💻 GitHub
        </a>

        <!-- Save Contact -->
        <button
            class="button save"
            onclick="saveContact()">
            + Save Contact
        </button>

    </div>

    <div class="footer">
        Digital Business Card
    </div>

</div>


<script>

function saveContact() {

    const vCard =
`BEGIN:VCARD
VERSION:3.0
FN:Your Name
TITLE:Full-Stack Developer
TEL:+212600000000
EMAIL:your@email.com
URL:https://www.linkedin.com/
NOTE:Digital Business Card
END:VCARD`;

    const blob = new Blob(
        [vCard],
        { type: "text/vcard" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "contact.vcf";

    document.body.appendChild(link);
    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}

</script>

</body>
</html>
